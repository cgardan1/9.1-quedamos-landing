name: Publicar landing

# Copia quedamos-landing/ a la raíz de la rama gh-pages, que es la que sirve GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "quedamos-landing/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-landing
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          arbol=$(git rev-parse HEAD:quedamos-landing)
          padre=$(git rev-parse --verify -q origin/gh-pages || true)
          if [ -n "$padre" ] && [ "$(git rev-parse "$padre^{tree}")" = "$arbol" ]; then
            echo "gh-pages ya está al día."
            exit 0
          fi
          commit=$(git commit-tree "$arbol" ${padre:+-p "$padre"} -m "Publica ${GITHUB_SHA::7}")
          git push origin "$commit:refs/heads/gh-pages"
